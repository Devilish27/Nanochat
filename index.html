<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nanochat</title>
<style>
:root{--bg:#f6f7f5;--panel:#fff;--ink:#1c2321;--mute:#6b7773;--line:#dde2df;--accent:#0f6b5c;--accent-ink:#fff;--user:#e3efec;--code:#eef1ef;--err:#b3261e;--sel:#e9eeec;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121615;--panel:#1a201f;--ink:#e4eae7;--mute:#8d9a95;--line:#2b3331;--accent:#3fb59f;--accent-ink:#08201b;--user:#1f2f2b;--code:#232b29;--err:#f2867e;--sel:#242d2b;color-scheme:dark}}
/* Themes: pick one in Settings. "auto" (no block) follows the system light/dark setting. Blocks also scope the swatches. */
[data-theme="light"]{--bg:#f6f7f5;--panel:#ffffff;--ink:#1c2321;--mute:#6b7773;--line:#dde2df;--accent:#0f6b5c;--accent-ink:#ffffff;--user:#e3efec;--code:#eef1ef;--err:#b3261e;--sel:#e9eeec;color-scheme:light}
[data-theme="dark"]{--bg:#121615;--panel:#1a201f;--ink:#e4eae7;--mute:#8d9a95;--line:#2b3331;--accent:#3fb59f;--accent-ink:#08201b;--user:#1f2f2b;--code:#232b29;--err:#f2867e;--sel:#242d2b;color-scheme:dark}
[data-theme="paper"]{--bg:#f3ead7;--panel:#fbf5e6;--ink:#33291d;--mute:#6a5d4d;--line:#d9cba9;--accent:#8b4a10;--accent-ink:#fffaf0;--user:#e8d8b4;--code:#eee3c8;--err:#a02018;--sel:#e9dec3;color-scheme:light}
[data-theme="sky"]{--bg:#eef3fa;--panel:#ffffff;--ink:#16202e;--mute:#566880;--line:#d3dcea;--accent:#1f5fbf;--accent-ink:#ffffff;--user:#dce8fa;--code:#e8eef7;--err:#b3261e;--sel:#e3ebf6;color-scheme:light}
[data-theme="rose"]{--bg:#fbf2f4;--panel:#ffffff;--ink:#2a1a1f;--mute:#765a63;--line:#ecd5db;--accent:#b0245a;--accent-ink:#ffffff;--user:#f8e1e8;--code:#f6e9ed;--err:#b3261e;--sel:#f4e3e8;color-scheme:light}
[data-theme="midnight"]{--bg:#0b1020;--panel:#121a30;--ink:#e6ebf7;--mute:#93a0c0;--line:#232d4a;--accent:#6ea8ff;--accent-ink:#07142b;--user:#1a2a52;--code:#18213a;--err:#ff8f8f;--sel:#1a2340;color-scheme:dark}
[data-theme="nord"]{--bg:#2e3440;--panel:#3b4252;--ink:#eceff4;--mute:#b8c2d3;--line:#4c566a;--accent:#88c0d0;--accent-ink:#20262f;--user:#434c5e;--code:#353c4a;--err:#f2a0a8;--sel:#434c5e;color-scheme:dark}
[data-theme="forest"]{--bg:#0f1a14;--panel:#15241b;--ink:#e3efe6;--mute:#8fb09a;--line:#25392d;--accent:#5fcf8a;--accent-ink:#06180d;--user:#1c3a28;--code:#1a2c21;--err:#f19a8f;--sel:#1d3125;color-scheme:dark}
[data-theme="violet"]{--bg:#1e1b2e;--panel:#282440;--ink:#ece8ff;--mute:#a8a3cc;--line:#3a3560;--accent:#b794f6;--accent-ink:#1b0f33;--user:#373063;--code:#2f2a52;--err:#ff8fa3;--sel:#322d57;color-scheme:dark}
[data-theme="terminal"]{--bg:#050805;--panel:#0b120b;--ink:#b8f5c4;--mute:#6fae7c;--line:#1f3a22;--accent:#39ff6a;--accent-ink:#021a08;--user:#123018;--code:#0e1a0f;--err:#ff7b72;--sel:#132713;--font:ui-monospace,"Cascadia Mono",Consolas,monospace;color-scheme:dark}
[data-theme="contrast"]{--bg:#000000;--panel:#000000;--ink:#ffffff;--mute:#d0d0d0;--line:#bdbdbd;--accent:#ffe600;--accent-ink:#000000;--user:#2b2b2b;--code:#141414;--err:#ff8080;--sel:#2e2e2e;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;background:var(--bg);color:var(--ink);font:15px/1.55 var(--font,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif)}
input,select,textarea,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
button{cursor:pointer;background:var(--panel)}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
aside{width:260px;flex:none;display:flex;flex-direction:column;gap:10px;padding:12px;background:var(--panel);border-right:1px solid var(--line)}
#list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin:0 -4px}
.it{display:flex;align-items:center;gap:4px;padding:6px 8px;border-radius:6px;cursor:pointer}
.it:hover,.it.on{background:var(--sel)}
.it span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it button{border:0;background:none;color:var(--mute);padding:0 4px;visibility:hidden}
.it:hover button{visibility:visible}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;color:var(--mute)}
details label{display:block;margin-top:8px;color:var(--mute);font-size:13px}
details input{width:100%;margin-top:4px}
details button{margin-top:10px;width:100%}
.hint{margin:8px 0 0;color:var(--mute);font-size:12px;line-height:1.4}
.hint a{color:var(--accent)}
.lbl{margin-top:12px;color:var(--mute);font-size:13px}.lbl b{color:var(--ink);font-weight:600}
#themes{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:6px}
#themes .sw{margin:0;width:auto;aspect-ratio:1;padding:3px;border:2px solid transparent;border-radius:9px;background:none}
#themes .sw[aria-pressed=true]{border-color:var(--accent)}
.sws{display:block;width:100%;height:100%;border:1px solid var(--line);border-radius:6px;background:linear-gradient(135deg,var(--bg) 50%,var(--accent) 50%)}
.sws.auto{background:linear-gradient(135deg,#f6f7f5 50%,#121615 50%)}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.bar{display:flex;gap:6px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.bar input{flex:1}.bar select{flex:2}
#fav{font:17px/1 system-ui,-apple-system,"Segoe UI Symbol","Segoe UI",sans-serif;padding:4px 10px;min-width:40px}
.bar #effort{flex:none}
.think{margin:0 0 8px;color:var(--mute);font-size:13px}
.think summary{cursor:pointer}
.think .tb{margin-top:6px;padding-left:10px;border-left:2px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}
.lw{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
#log{flex:1;overflow-y:auto;padding:18px 14px}
#down{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);border-radius:999px;padding:4px 14px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.cbw{margin:8px 0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.cbh{display:flex;justify-content:space-between;align-items:center;padding:3px 8px;background:var(--sel);color:var(--mute);font-size:12px;border-bottom:1px solid var(--line)}
.cbh button{padding:2px 8px;font-size:12px;margin-left:6px}
.cbw pre{margin:0;border-radius:0}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.m{padding:10px 14px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.m.user{background:var(--user);align-self:flex-end;max-width:90%}
.m.assistant{background:var(--panel);border:1px solid var(--line)}
.m pre{background:var(--code);border-radius:6px;padding:10px;margin:8px 0;overflow-x:auto;white-space:pre}
.m code{font:13px/1.45 ui-monospace,Consolas,monospace;background:var(--code);padding:1px 5px;border-radius:4px}
.m pre code{background:none;padding:0}
.empty{color:var(--mute);text-align:center;margin-top:12vh}
footer{padding:10px 14px 14px}
footer .wrap{flex-direction:row;align-items:flex-end;gap:8px}
textarea{flex:1;resize:none;min-height:42px;background:var(--panel)}
#status{max-width:780px;margin:0 auto 6px;color:var(--mute);font-size:12px;min-height:16px}
#status.err{color:var(--err)}
</style>
</head>
<body>
<aside>
  <button id="new" class="primary">New chat</button>
  <div id="list"></div>
  <details id="set">
    <summary>Settings</summary>
    <label>OpenRouter API key<input id="key" type="password" placeholder="sk-or-…" autocomplete="off" spellcheck="false"></label>
    <label>Google AI Studio (Gemini) API key<input id="gkey" type="password" placeholder="AIza…" autocomplete="off" spellcheck="false"></label>
    <p class="hint">Use either key, or both. Free Gemini key: <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer">aistudio.google.com/apikey</a></p>
    <div class="lbl">Theme: <b id="tname">Auto</b></div>
    <div id="themes" role="group" aria-label="Theme"></div>
    <button id="quit">Quit app</button>
  </details>
</aside>
<main>
  <div class="bar">
    <input id="filter" type="search" placeholder="Filter models…">
    <select id="model" aria-label="Model"><option value="">Loading models…</option></select>
    <button id="fav" title="Add or remove from favorites">☆</button>
    <select id="effort" aria-label="Thinking effort" style="display:none"></select>
  </div>
  <div class="lw"><div id="log"><div class="wrap" id="msgs"></div></div><button id="down" hidden title="Jump to latest">↓ Latest</button></div>
  <footer>
    <div id="status"></div>
    <div class="wrap">
      <textarea id="input" rows="1" placeholder="Message… (Enter to send, Shift+Enter for a new line)"></textarea>
      <button id="send" class="primary">Send</button>
    </div>
  </footer>
</main>

<script>
const $ = id => document.getElementById(id);
const api = async (method, url, body) => {
  const r = await fetch(url, { method, body: body === undefined ? undefined : JSON.stringify(body) });
  if (!r.ok) throw new Error(r.status);
  return r.status === 204 ? null : r.json();
};
const newChat = () => ({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title: 'New chat', model: '', updated: '', messages: [] });

let S = { key: '', gkey: '', favorites: [], model: '', effort: '', theme: 'auto' };
let models = [], orModels = [], gemModels = [], loading = 0, gemSeq = 0, chat = newChat(), ctrl = null;
const GEM = 'https://generativelanguage.googleapis.com/v1beta/';
const isGem = id => (id || '').startsWith('gemini:'); // Gemini models are listed as "gemini:<model name>"

/* ---------- themes ---------- */
const THEMES = [['auto', 'Auto (system)'], ['light', 'Light'], ['paper', 'Paper'], ['sky', 'Sky'], ['rose', 'Rose'], ['dark', 'Dark'], ['midnight', 'Midnight'], ['nord', 'Nord'], ['forest', 'Forest'], ['violet', 'Violet'], ['terminal', 'Terminal'], ['contrast', 'High contrast']]; // keep in sync with the [data-theme] blocks in the CSS
function applyTheme(id) {
  if (!THEMES.some(t => t[0] === id)) id = 'auto';
  S.theme = id;
  document.documentElement.dataset.theme = id;
  $('tname').textContent = THEMES.find(t => t[0] === id)[1];
  document.querySelectorAll('#themes .sw').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.t === id)));
}
function buildThemes() {
  THEMES.forEach(([id, name]) => {
    const b = document.createElement('button'), sw = document.createElement('span');
    b.className = 'sw'; b.dataset.t = id; b.title = name; b.setAttribute('aria-label', name);
    sw.className = id === 'auto' ? 'sws auto' : 'sws';
    if (id !== 'auto') sw.dataset.theme = id; // the swatch paints itself with that theme's own colors
    b.appendChild(sw);
    b.onclick = () => { applyTheme(id); saveSettings(); };
    $('themes').appendChild(b);
  });
}

/* ---------- formatting ---------- */
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const inline = s => esc(s).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
const fmt = t => {
  const parts = t.split('```');
  return parts.map((p, i) => {
    if (i % 2 === 0) return inline(p);
    const nl = p.indexOf('\n'), lang = nl < 0 ? '' : p.slice(0, nl).trim(), code = (nl < 0 ? p : p.slice(nl + 1)).replace(/\n$/, '');
    const pre = '<pre><code>' + esc(code) + '</code></pre>';
    if (i === parts.length - 1) return pre; // fence still open: block is being written
    const html = /^html?$/i.test(lang) || /^\s*<(!doctype html|html)/i.test(code);
    return '<div class="cbw"><div class="cbh"><span>' + esc(lang || 'code') + '</span><span><button data-act="copy">Copy</button>' +
      (html ? '<button data-act="dl">Download .html</button>' : '') + '</span></div>' + pre + '</div>';
  }).join('');
};

/* ---------- messages ---------- */
function bubble(role, text, reasoning, secs) {
  const d = document.createElement('div');
  d.className = 'm ' + role;
  if (role === 'user') d.textContent = text;
  else {
    const b = document.createElement('div');
    b.className = 'body'; b.innerHTML = fmt(text);
    d.appendChild(b);
    if (reasoning) setThink(d, reasoning, secs === undefined ? null : secs, false);
  }
  $('msgs').appendChild(d);
  return d;
}
function setThink(d, text, secs, open) {
  let t = d.querySelector('.think');
  if (!t) {
    t = document.createElement('details'); t.className = 'think';
    t.innerHTML = '<summary></summary><div class="tb"></div>';
    d.insertBefore(t, d.firstChild);
  }
  t.querySelector('.tb').textContent = text;
  t.querySelector('summary').textContent = secs == null ? 'Thinking…' : (secs < 1 ? 'Thought briefly' : 'Thought for ' + secs + ' s');
  if (open !== undefined) t.open = open;
}
let stick = true; // follow new text only while the user is at the bottom
const atBottom = () => { const l = $('log'); return l.scrollHeight - l.scrollTop - l.clientHeight < 40; };
const scroll = force => {
  const l = $('log');
  if (force) stick = true;
  if (stick) l.scrollTop = l.scrollHeight;
  $('down').hidden = stick;
};
function renderChat() {
  $('msgs').innerHTML = chat.messages.length ? '' : '<div class="empty">Add an API key (OpenRouter or Google AI Studio) under Settings, pick a model and start typing.</div>';
  chat.messages.forEach(m => bubble(m.role, m.content, m.reasoning, m.secs));
  scroll(true);
}
function status(t, err) { $('status').textContent = t || ''; $('status').className = err ? 'err' : ''; }

/* ---------- chat list ---------- */
async function refreshList() {
  let items = [];
  try { items = await api('GET', '/api/chats'); } catch {}
  const list = $('list');
  list.innerHTML = '';
  items.forEach(c => {
    const row = document.createElement('div');
    row.className = 'it' + (c.id === chat.id ? ' on' : '');
    row.title = new Date(c.updated).toLocaleString() + ' (double-click to rename)';
    const t = document.createElement('span'); t.textContent = c.title;
    const x = document.createElement('button'); x.textContent = '×'; x.title = 'Delete chat';
    row.append(t, x);
    row.onclick = () => openChat(c.id);
    row.ondblclick = async () => {
      const name = prompt('Rename chat', c.title);
      if (!name || !name.trim()) return;
      const full = await api('GET', '/api/chats/' + c.id);
      full.title = name.trim();
      await api('PUT', '/api/chats/' + c.id, full);
      if (chat.id === c.id) chat.title = full.title;
      refreshList();
    };
    x.onclick = async e => {
      e.stopPropagation();
      if (!confirm('Delete “' + c.title + '”?')) return;
      await api('DELETE', '/api/chats/' + c.id);
      if (chat.id === c.id) startNew();
      refreshList();
    };
    list.appendChild(row);
  });
}
async function openChat(id) {
  if (ctrl) ctrl.abort();
  try { chat = await api('GET', '/api/chats/' + id); } catch { status('Could not open that chat.', true); return; }
  if (chat.model && [...$('model').options].some(o => o.value === chat.model)) $('model').value = chat.model;
  updateFav(); fillEffort(); renderChat(); refreshList(); status('');
}
function startNew() {
  if (ctrl) ctrl.abort();
  chat = newChat(); renderChat(); refreshList(); status(''); $('input').focus();
}
async function saveChat(c) {
  c.updated = new Date().toISOString();
  c.model = $('model').value || c.model;
  if (c.title === 'New chat') { const f = c.messages.find(m => m.role === 'user'); if (f) c.title = f.content.replace(/\s+/g, ' ').slice(0, 48); }
  try { await api('PUT', '/api/chats/' + c.id, c); } catch { status('Could not save this chat to disk.', true); }
  refreshList();
}

/* ---------- models & favorites ---------- */
function opt(m) {
  const o = document.createElement('option');
  o.value = m.id;
  o.textContent = (m.name || m.id) + (m.pricing && +m.pricing.prompt === 0 && +m.pricing.completion === 0 ? ' (free)' : '');
  return o;
}
function fillModels() {
  const sel = $('model');
  if (!models.length) {
    if (loading <= 1) sel.innerHTML = '<option value="">Could not load models (check connection)</option>';
    updateFav(); fillEffort();
    return;
  }
  const q = $('filter').value.trim().toLowerCase();
  // while the lists are still loading, aim for the saved model instead of whatever is selected now
  const cur = (loading ? S.model : '') || sel.value || S.model;
  const hit = m => !q || m.id.toLowerCase().includes(q) || (m.name || '').toLowerCase().includes(q);
  const favs = models.filter(m => S.favorites.includes(m.id) && hit(m));
  const rest = models.filter(hit);
  sel.innerHTML = '';
  const group = (label, list) => {
    if (!list.length) return;
    const g = document.createElement('optgroup'); g.label = label;
    list.forEach(m => g.appendChild(opt(m))); sel.appendChild(g);
  };
  group('★ Favorites', favs);
  group('Google AI Studio (Gemini)', rest.filter(m => m.gem));
  group(gemModels.length ? 'OpenRouter models' : 'All models', rest.filter(m => !m.gem));
  if ([...sel.options].some(o => o.value === cur)) sel.value = cur; /* else keep first option */
  updateFav(); fillEffort();
}
function fillEffort() {
  const sel = $('effort'), m = models.find(x => x.id === $('model').value);
  let list = null, dflt = '', off = false; // list = effort values offered for this model
  if (m && m.gem) {
    const t = m.think;
    if (t && t.levels.length) { list = t.levels.slice().reverse(); off = t.off; }
  } else {
    const r = m && m.reasoning;
    if (m && (r || (m.supported_parameters || []).includes('reasoning'))) {
      dflt = r && r.default_effort && r.default_effort !== 'none' ? ' (' + r.default_effort + ')' : '';
      off = !(r && r.mandatory);
      list = r && r.supported_efforts ? r.supported_efforts.filter(e => e !== 'none').slice().reverse() : ['minimal', 'low', 'medium', 'high', 'xhigh'];
    }
  }
  sel.innerHTML = '';
  sel.style.display = list ? '' : 'none';
  if (!list) return;
  const add = (v, t) => { const o = document.createElement('option'); o.value = v; o.textContent = 'Thinking: ' + t; sel.appendChild(o); };
  add('', 'default' + dflt);
  if (off) add('none', 'off');
  list.forEach(e => add(e, e));
  sel.value = [...sel.options].some(o => o.value === S.effort) ? S.effort : '';
}
function updateFav() { $('fav').textContent = S.favorites.includes($('model').value) ? '★' : '☆'; }
const saveSettings = () => api('PUT', '/api/settings', S).catch(() => status('Could not save settings.', true));
const settle = () => { models = gemModels.concat(orModels); fillModels(); loading = Math.max(0, loading - 1); };
async function loadOpenRouter() {
  try {
    const j = await (await fetch('https://openrouter.ai/api/v1/models')).json();
    orModels = (j.data || []).sort((a, b) => (a.name || a.id).localeCompare(b.name || b.id));
  } catch { orModels = []; }
  settle();
}

/* Gemini: which thinking controls does a model accept? (Google's docs: 2.5 = token budget, 3 and newer = named levels) */
function gemThink(name, flag) {
  if (flag === false) return null;                      // API says: no thinking
  const v = parseFloat((name.match(/^gemini-(\d+(?:\.\d+)?)/) || [])[1]);
  if (flag === undefined && !(v >= 2.5)) return null;   // no flag in the listing: guess from the version
  if (isNaN(v)) return { levels: [], off: false };      // thinks, but control style unknown: only show the thoughts
  if (v < 2.5) return null;
  if (v < 3) {                                          // Gemini 2.5: thinkingBudget (Pro cannot be switched off)
    const pro = /pro/.test(name);
    return { levels: ['low', 'medium', 'high'], off: !pro, budget: { low: 1024, medium: 8192, high: pro ? 32768 : 24576 } };
  }
  let levels = ['low', 'medium', 'high'];               // Gemini 3 and newer: thinkingLevel
  if (/^gemini-4-hydrogen/.test(name)) levels.push('xhigh');
  else if (/^gemini-3-pro/.test(name)) levels = ['low', 'high'];
  else if (/^gemini-3(\.\d+)?-flash/.test(name) && !/^gemini-3\.8-/.test(name)) levels.unshift('minimal');
  return { levels, off: false };
}
async function loadGemini() {
  const my = ++gemSeq, key = (S.gkey || '').trim();
  let list = [];
  if (key) {
    try {
      let tok = '', raw = [];
      do {
        const r = await fetch(GEM + 'models?pageSize=1000' + (tok ? '&pageToken=' + encodeURIComponent(tok) : ''), { headers: { 'x-goog-api-key': key } });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error((j.error && j.error.message) || r.status + ' ' + r.statusText);
        raw = raw.concat(j.models || []); tok = j.nextPageToken || '';
      } while (tok);
      list = raw
        .filter(m => (m.supportedGenerationMethods || []).includes('generateContent') && !/tts|image|embed|audio|live|aqa|imagen|veo|lyria|robotics|computer-use|learnlm|deep-research/i.test(m.name))
        .map(m => { const n = m.name.replace(/^models\//, ''); return { id: 'gemini:' + n, name: m.displayName || n, gem: true, think: gemThink(n, m.thinking) }; })
        .sort((a, b) => (b.id.startsWith('gemini:gemini') - a.id.startsWith('gemini:gemini')) || b.id.localeCompare(a.id, undefined, { numeric: true }));
      if (!list.length) status('Your Gemini key works, but no chat models were returned.', true);
    } catch (e) { status('Could not load Gemini models: ' + e.message, true); }
  }
  if (my !== gemSeq) return; // a newer load (key changed again) has taken over
  gemModels = list;
  settle();
}

/* ---------- sending ---------- */
async function send() {
  if (ctrl) return;
  const text = $('input').value.trim(), model = $('model').value, gem = isGem(model);
  const keyEl = gem ? $('gkey') : $('key'), key = keyEl.value.trim();
  if (!text) return;
  if (!model) { status('Pick a model first.', true); return; }
  if (!key) { $('set').open = true; keyEl.focus(); status('Enter your ' + (gem ? 'Google AI Studio (Gemini)' : 'OpenRouter') + ' API key under Settings.', true); return; }

  const c = chat;
  if (!c.messages.length) $('msgs').innerHTML = '';
  c.messages.push({ role: 'user', content: text });
  const uEl = bubble('user', text), el = bubble('assistant', '');
  $('input').value = ''; autosize(); scroll(true);

  const body = el.querySelector('.body');
  let reply = '', thinking = '', secs = null, t0 = 0, failed = null, finish = '', blocked = '';
  ctrl = new AbortController();
  $('send').textContent = 'Stop';
  status('Waiting for ' + model.replace(/^gemini:/, '') + '…');
  try {
    const msgs = c.messages.map(({ role, content }) => ({ role, content })), effort = $('effort').value;
    const req = gem
      ? { url: GEM + 'models/' + encodeURIComponent(model.replace(/^gemini:/, '')) + ':streamGenerateContent?alt=sse',
          headers: { 'x-goog-api-key': key, 'Content-Type': 'application/json' },
          body: gemBody(msgs, models.find(x => x.id === model), effort) }
      : { url: 'https://openrouter.ai/api/v1/chat/completions',
          headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json', 'X-Title': 'Nanochat' },
          body: { model, messages: msgs, stream: true, reasoning: effort ? { effort } : undefined } };
    const r = await fetch(req.url, { method: 'POST', signal: ctrl.signal, headers: req.headers, body: JSON.stringify(req.body) });
    if (!r.ok) {
      let msg = r.status + ' ' + r.statusText;
      try { let e = await r.json(); if (Array.isArray(e)) e = e[0]; msg = e.error.message || msg; } catch {}
      throw new Error(msg);
    }
    const rd = r.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await rd.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const d = line.slice(6).trim();
        if (d === '[DONE]') continue;
        let j; try { j = JSON.parse(d); } catch { continue; }
        if (j.error) throw new Error(j.error.message || 'Stream error');
        let rs = '', ct = '';
        if (gem) {
          const cd = j.candidates && j.candidates[0];
          if (j.promptFeedback && j.promptFeedback.blockReason) blocked = j.promptFeedback.blockReason;
          if (cd) {
            if (cd.finishReason) finish = cd.finishReason;
            for (const p of (cd.content && cd.content.parts) || []) if (typeof p.text === 'string') { if (p.thought) rs += p.text; else ct += p.text; }
          }
        } else {
          const dl = (j.choices && j.choices[0] && j.choices[0].delta) || {};
          rs = typeof dl.reasoning === 'string' ? dl.reasoning : typeof dl.reasoning_content === 'string' ? dl.reasoning_content : '';
          if (!rs && Array.isArray(dl.reasoning_details)) rs = dl.reasoning_details.map(x => x.text || x.summary || '').join('');
          ct = dl.content || '';
        }
        if (rs) {
          if (!t0) t0 = Date.now();
          thinking += rs;
          setThink(el, thinking, secs, secs === null && thinking === rs ? true : undefined);
          if (c === chat) scroll();
        }
        if (ct) {
          if (thinking && secs === null) { secs = Math.round((Date.now() - t0) / 1000); setThink(el, thinking, secs, false); }
          reply += ct; body.innerHTML = fmt(reply);
          if (c === chat) scroll();
        }
      }
    }
    if (gem) { // Gemini reports blocks and early stops inside the stream instead of as HTTP errors
      if (blocked) throw new Error('Gemini blocked the prompt (' + blocked + ')');
      if (finish === 'MAX_TOKENS') throw new Error('output token limit reached');
      if (finish && !['STOP', 'FINISH_REASON_UNSPECIFIED', 'CONTINUATION'].includes(finish)) throw new Error('Gemini stopped the reply (' + finish + ')');
      if (!reply) throw new Error('Gemini returned an empty reply');
    }
  } catch (e) { if (e.name !== 'AbortError') failed = e.message; }

  ctrl = null;
  $('send').textContent = 'Send';
  if (thinking && secs === null) { secs = Math.round((Date.now() - t0) / 1000); setThink(el, thinking, secs, false); }
  if (reply) {
    c.messages.push({ role: 'assistant', content: reply, reasoning: thinking || undefined, secs: thinking ? secs : undefined });
    status(failed ? 'Reply cut short: ' + failed : '', !!failed);
  } else {
    c.messages.pop(); uEl.remove(); el.remove();
    if (c === chat) { $('input').value = text; autosize(); }
    status(failed ? 'Error: ' + failed : 'Stopped.', !!failed);
  }
  if (c.messages.length) saveChat(c);
}
/* Gemini request body. Roles: assistant -> model. thinkingConfig only for models that think. */
function gemBody(msgs, m, effort) {
  const body = { contents: msgs.map(x => ({ role: x.role === 'assistant' ? 'model' : 'user', parts: [{ text: x.content }] })) };
  const t = m && m.think;
  if (t) {
    const tc = {};
    if (effort === 'none' && t.off) tc.thinkingBudget = 0;           // 2.5 Flash / Flash-Lite only; thoughts can't be requested when off
    else {
      tc.includeThoughts = true;                                      // stream thought summaries into the "Thinking" box
      if (effort && t.levels.includes(effort)) { if (t.budget) tc.thinkingBudget = t.budget[effort]; else tc.thinkingLevel = effort; }
    }
    body.generationConfig = { thinkingConfig: tc };
  }
  return body;
}
function autosize() {
  const t = $('input'); t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight + 2, innerHeight * 0.4) + 'px';
}

/* ---------- wiring ---------- */
$('log').addEventListener('scroll', () => { stick = atBottom(); $('down').hidden = stick; });
$('down').onclick = () => scroll(true);
$('msgs').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const code = b.closest('.cbw').querySelector('code').textContent;
  if (b.dataset.act === 'dl') return download(code);
  navigator.clipboard.writeText(code).then(() => { b.textContent = 'Copied'; setTimeout(() => { b.textContent = 'Copy'; }, 1200); }).catch(() => {});
});
function download(code) {
  const m = code.match(/<title[^>]*>([^<]{1,80})<\/title>/i);
  const base = m ? m[1].trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') : '';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([code + '\n'], { type: 'text/html' }));
  a.download = (base || 'document') + '.html';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
$('new').onclick = startNew;
$('send').onclick = () => ctrl ? ctrl.abort() : send();
$('input').oninput = autosize;
$('input').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } };
$('filter').oninput = fillModels;
$('model').onchange = () => { S.model = $('model').value; updateFav(); fillEffort(); saveSettings(); };
$('effort').onchange = () => { S.effort = $('effort').value; saveSettings(); };
$('fav').onclick = () => {
  const id = $('model').value; if (!id) return;
  S.favorites = S.favorites.includes(id) ? S.favorites.filter(x => x !== id) : [...S.favorites, id];
  S.model = id; saveSettings(); fillModels();
};
$('key').onchange = () => { S.key = $('key').value.trim(); saveSettings(); };
$('gkey').onchange = () => { S.gkey = $('gkey').value.trim(); saveSettings(); status(S.gkey ? 'Loading Gemini models…' : ''); loadGemini().then(() => { if (S.gkey && $('status').textContent === 'Loading Gemini models…') status(''); }); };
$('quit').onclick = async () => {
  if (!confirm('Quit Nanochat? Your chats are saved.')) return;
  try { await api('POST', '/api/quit'); } catch {}
  document.body.innerHTML = '<p style="margin:20vh auto;text-align:center">Closed. You can close this tab.</p>';
};

(async () => {
  const ping = () => fetch('/api/ping').catch(() => {});
  ping(); setInterval(ping, 10000);
  try { Object.assign(S, await api('GET', '/api/settings')); } catch {}
  buildThemes(); applyTheme(S.theme);
  $('key').value = S.key || ''; $('gkey').value = S.gkey || '';
  if (!S.key && !S.gkey) $('set').open = true;
  renderChat(); refreshList();
  loading = 2; loadOpenRouter(); loadGemini();
})();
</script>
</body>
